    include_profile: false
    include_agent_identity: false
    section_max_chars: 1200
    preferred_source_types:
      - markdown
      - current_state

roots:
  # Documented live vault (may be absent). Override with HYPERMIND_VAULT.
  obsidian_vault: "C:\\Obsidian vaults\\Hypermind vault"
  profile: hypermind/config/profile.md
  decision_log: portfolio-os/governance/Decision_Log.md

privacy:
  deny_path_segments:
    - Health
    - Dating
    - "Personal Growth"
    - personal_growth
    - dating
    - health
  profile_default: false
